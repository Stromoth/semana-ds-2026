<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do jogo no catálogo GameBrain.">
  <title>Detalhes do jogo · Gamebox</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="topline">
  <div class="app-shell">
    <header class="topbar">
      <div class="site-width auth-topbar">
        <a class="brand-link" href="/" aria-label="Voltar à Gamebox">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="brand-name">GAMEBOX</span>
        </a>
        <nav class="library-topbar-actions" aria-label="Navegação da conta">
          <a class="nav-link" href="/">DESCOBRIR</a>
          <a class="nav-link" href="/pages/biblioteca.html">MINHA BIBLIOTECA</a>
          <a class="nav-link" href="/pages/login.html">ENTRAR</a>
        </nav>
      </div>
    </header>

    <main class="game-detail-main">
      <p id="game-detail-status" class="form-status" role="status" aria-live="polite">Carregando detalhes do jogo…</p>
      <article id="game-detail" class="game-detail-panel" hidden>
        <img id="game-detail-cover" class="game-detail-cover" alt="">
        <div class="game-detail-content">
          <p class="section-kicker">CATÁLOGO GAMEBRAIN</p>
          <h1 id="game-detail-title" class="game-detail-title"></h1>
          <div id="game-detail-meta" class="game-detail-meta"></div>
          <p id="game-detail-description" class="game-detail-description"></p>
          <div class="game-detail-actions">
            <button id="game-detail-add" class="orange-btn" type="button">ADICIONAR À BIBLIOTECA</button>
            <a id="game-detail-source" class="game-detail-link" target="_blank" rel="noopener noreferrer" hidden>Ver no GameBrain</a>
          </div>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="site-width flex items-center justify-between gap-4">
        <span class="brand-name">GAMEBOX</span>
        <p class="footer-copy">Dados de jogos por <a href="https://gamebrain.co/api" target="_blank" rel="noopener noreferrer">GameBrain</a></p>
      </div>
    </footer>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/jogo.js"></script>
</body>
</html>
