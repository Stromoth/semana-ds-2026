<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte e organize os jogos da sua biblioteca Gamebox.">
  <title>Minha biblioteca · Gamebox</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="topline">
  <div class="app-shell">
    <header class="topbar" data-site-header></header>

    <main class="library-main site-width">
      <section aria-labelledby="library-title">
        <p class="section-kicker">SEUS JOGOS, DO SEU JEITO</p>
        <div class="library-heading">
          <h1 class="section-title section-title--xl" id="library-title">MINHA BIBLIOTECA</h1>
          <span id="library-count" class="section-kicker" aria-live="polite"></span>
        </div>
        <p class="library-notice">Encontre jogos no catálogo GameBrain e adicione-os à sua biblioteca pela página inicial.</p>
        <p id="library-status" class="form-status" role="status" aria-live="polite"></p>
        <div id="library-list" class="library-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </div>
  <script src="../js/site-shell.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/biblioteca.js"></script>
</body>
</html>
